name: Validate smaller batch-size starts
on:
  push:
    branches:
      - validation/batch-size-smaller-start-20261112
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:tests
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8e7e21e686a854219e2053fb1182711be1806719
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . torch==2.9.1 pytest==9.0.2 pytest-timeout==2.4.0 pytest-rerunfailures==16.1 pytest-random-order==1.2.0 tensorboardX==2.6.4 "jsonargparse[signatures]==4.41.0" rich matplotlib psutil ruff==0.15.9
          python -m pip freeze > installed-dependencies.txt
      - name: Test exact patched native tuner
        run: |
          test "$(git rev-parse HEAD)" = "8e7e21e686a854219e2053fb1182711be1806719"
          set +e
          python -m pytest -q tests/tests_pytorch/tuner/test_batch_size_decrease.py tests/tests_pytorch/tuner/test_scale_batch_size.py --junitxml=patched.xml > patched.log 2>&1
          status=$?
          cat patched.log
          exit "$status"
      - name: Compare unchanged upstream source
        if: always()
        run: |
          git checkout 84df182f50ab34301aabb3c0eb4031815bfb413d -- src/lightning/pytorch/tuner/batch_size_scaling.py
          python - <<'PY'
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          with open("baseline.log", "w") as log:
              result = subprocess.run([sys.executable, "-m", "pytest", "-q", "tests/tests_pytorch/tuner/test_batch_size_decrease.py", "--junitxml=baseline.xml"], stdout=log, stderr=subprocess.STDOUT, check=False)
          print(open("baseline.log").read(), flush=True)
          suites = ET.parse("baseline.xml").getroot()
          totals = {name: sum(int(s.get(name, 0)) for s in suites.iter("testsuite")) for name in ("tests", "failures", "errors", "skipped")}
          print("Unchanged upstream regression totals:", totals, flush=True)
          assert result.returncode == 1 and totals["errors"] == 0 and totals["failures"] > 0
          PY
          python -m pytest -q tests/tests_pytorch/tuner/test_scale_batch_size.py --junitxml=baseline-existing.xml
      - name: Restore exact final source and check style
        if: always()
        run: |
          git checkout 8e7e21e686a854219e2053fb1182711be1806719 -- src/lightning/pytorch/tuner/batch_size_scaling.py
          python -m ruff check src/lightning/pytorch/tuner/batch_size_scaling.py tests/tests_pytorch/tuner/test_batch_size_decrease.py
          python -m ruff format --check --diff src/lightning/pytorch/tuner/batch_size_scaling.py tests/tests_pytorch/tuner/test_batch_size_decrease.py
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-size-smaller-start-before-after
          path: |
            patched.xml
            patched.log
            baseline.xml
            baseline.log
            baseline-existing.xml
            installed-dependencies.txt
