name: Validate smaller batch-size starts
on:
  push:
    branches:
      - validation/batch-size-smaller-start-20261112
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:tests
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f0299972b5e3692da55653662c00dc146e10585
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . torch==2.9.1 pytest==9.0.2 pytest-timeout==2.4.0 pytest-rerunfailures==16.1 pytest-random-order==1.2.0 tensorboardX==2.6.4 "jsonargparse[signatures]==4.41.0" rich matplotlib psutil ruff==0.15.9
          python -m pip freeze > installed-dependencies.txt
      - name: Reproduce unchanged upstream behavior
        run: |
          test "$(git rev-parse HEAD)" = "2f0299972b5e3692da55653662c00dc146e10585"
          git diff 84df182f50ab34301aabb3c0eb4031815bfb413d -- src/lightning/pytorch/tuner/batch_size_scaling.py --exit-code
          python - <<'PY'
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", "tests/tests_pytorch/tuner/test_batch_size_decrease.py", "--junitxml=baseline.xml"], check=False)
          suites = ET.parse("baseline.xml").getroot()
          totals = {name: sum(int(s.get(name, 0)) for s in suites.iter("testsuite")) for name in ("tests", "failures", "errors", "skipped")}
          print("Unchanged upstream regression totals:", totals, flush=True)
          assert result.returncode == 1 and totals["errors"] == 0 and totals["failures"] > 0
          PY
      - name: Inspect formatting
        if: always()
        run: |
          python -m ruff check tests/tests_pytorch/tuner/test_batch_size_decrease.py
          python -m ruff format --check --diff tests/tests_pytorch/tuner/test_batch_size_decrease.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-size-smaller-start-baseline
          path: |
            baseline.xml
            installed-dependencies.txt
