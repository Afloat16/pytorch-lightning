name: Validate tensor learning rate history
on:
  push:
    branches: [validation/tensor-learning-rate-history-20261113]
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src:tests
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install official CPU dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -e . torch==2.9.1 pytest==9.0.2 pytest-timeout==2.4.0 pytest-rerunfailures==16.1 pytest-random-order==1.2.0 tensorboardX==2.6.4 "jsonargparse[signatures]==4.41.0" rich matplotlib psutil ruff==0.15.9
      - name: Compare original and patched actual Trainer runs
        run: .venv/bin/python validation/run_lr_history.py
      - name: Check changed files
        if: always()
        run: |
          .venv/bin/ruff check src/lightning/pytorch/callbacks/lr_monitor.py tests/tests_pytorch/callbacks/test_lr_monitor_tensor_history.py
          .venv/bin/ruff format --check --diff src/lightning/pytorch/callbacks/lr_monitor.py tests/tests_pytorch/callbacks/test_lr_monitor_tensor_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lr-history-native-a914d621b0e1
          path: |
            before.log
            before.xml
            after.log
            after.xml
            existing.log
            existing.xml
            validation_result.json
