name: Validate optimizer toggle exception cleanup
on:
  push:
    branches:
      - validation/optimizer-toggle-exception-cleanup-20261112
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:tests
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c7bdabab45ab92df22ce1c2dcb7c4b3177e47553
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest==9.0.2 pytest-timeout==2.4.0 pytest-rerunfailures==16.1 pytest-random-order==1.2.0 tensorboardX==2.6.4 "jsonargparse[signatures]==4.41.0" rich matplotlib psutil ruff==0.15.9
          python -m pip freeze > installed-dependencies.txt
      - name: Verify exact production commit and native tests
        run: |
          test "$(git rev-parse HEAD)" = "c7bdabab45ab92df22ce1c2dcb7c4b3177e47553"
          python -m pytest tests/tests_pytorch/core/test_optimizer_toggle_cleanup.py tests/tests_pytorch/core/test_lightning_optimizer.py -q --junitxml=patched.xml
      - name: Check same regressions against original source
        run: |
          git show 84df182f50ab34301aabb3c0eb4031815bfb413d:src/lightning/pytorch/core/optimizer.py > src/lightning/pytorch/core/optimizer.py
          python - <<'PY'
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          command = [sys.executable, "-m", "pytest", "tests/tests_pytorch/core/test_optimizer_toggle_cleanup.py", "-q", "--junitxml=baseline.xml"]
          result = subprocess.run(command, check=False)
          suites = ET.parse("baseline.xml").getroot()
          totals = {name: sum(int(s.get(name, 0)) for s in suites.iter("testsuite")) for name in ("tests", "failures", "errors", "skipped")}
          print("Exact-base regression totals:", totals, flush=True)
          assert result.returncode == 1, result.returncode
          assert totals == {"tests": 20, "failures": 20, "errors": 0, "skipped": 0}, totals
          PY
          git restore src/lightning/pytorch/core/optimizer.py
      - name: Style and diff checks
        run: |
          python -m ruff check src/lightning/pytorch/core/optimizer.py tests/tests_pytorch/core/test_optimizer_toggle_cleanup.py
          python -m ruff format --check src/lightning/pytorch/core/optimizer.py tests/tests_pytorch/core/test_optimizer_toggle_cleanup.py
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimizer-toggle-native-results
          path: |
            patched.xml
            baseline.xml
            installed-dependencies.txt
