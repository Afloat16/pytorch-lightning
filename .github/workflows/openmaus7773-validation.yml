name: Validate handed-on long questions
on:
  push:
    branches: [validation/openmaus7773-long-question-20261127]
permissions:
  contents: read
jobs:
  questions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MAUS_CANDIDATE_SHA: d184bc6f9bada6e216910c52423fd33fd82d0ee7
      MAUS_CANDIDATE_TREE: 4b13b6a086325b8278548c2c83998641de1aba76
      MAUS_BASE_SHA: 8e2e3223c4b8e0e267e0d4bbbb0a955b3cb50d81
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/OpenMausBot
          ref: d184bc6f9bada6e216910c52423fd33fd82d0ee7
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and scope
        run: |
          test "$(git rev-parse HEAD)" = "$MAUS_CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$MAUS_CANDIDATE_TREE"
          python3 - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', os.environ['MAUS_BASE_SHA'], 'HEAD'], text=True).splitlines()
          assert sorted(paths) == ['server/coordinator.ts', 'server/host/acting-person.test.ts', 'server/host/acting-person.ts', 'server/host/ask-cards.test.ts', 'server/host/ask-cards.ts', 'server/index.ts', 'server/runtime-coordinator.ts'], paths
          print('Verified concurrent seven-file source; no replacement patch applied.')
          PY
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Real coordinator cards and private hand-back regressions
        run: pnpm exec vitest run server/host/ask-cards.test.ts server/runtime-coordinator.test.ts server/host/acting-person.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/candidate-tests.json"
      - name: Documented isolated two-server question card fixture
        run: pnpm exec vitest run server/question-cards.e2e.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/question-cards-e2e.json"
      - name: Verify restored source identity
        run: |
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$MAUS_CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$MAUS_CANDIDATE_TREE"
          git status --short
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openmaus-long-question-evidence
          path: |
            ${{ runner.temp }}/candidate-tests.json
            ${{ runner.temp }}/old-prefix-control.json
            ${{ runner.temp }}/question-cards-e2e.json
          if-no-files-found: warn
