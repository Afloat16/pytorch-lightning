name: Validate HTML raw-text review follow-up
on:
  push:
    branches: [validation/orca50681-raw-text-review-20261127]
permissions:
  contents: read
jobs:
  changed-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_CANDIDATE_SHA: 1208a28a7a4a72f5582a434c9a46694f350416ed
      ORCA_CANDIDATE_TREE: e9ad5c3861d90ef31e8a0e2418005450d0cd8216
      ORCA_BASE_SHA: 2413e14de04eabbc884593ba37f207e44cb8c27c
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Afloat16/orca
          ref: 1208a28a7a4a72f5582a434c9a46694f350416ed
          fetch-depth: 50
          persist-credentials: false
      - name: Verify exact candidate and two-file follow-up scope
        run: |
          test "$(git rev-parse HEAD)" = "$ORCA_CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$ORCA_CANDIDATE_TREE"
          python3 - <<'PYSCOPED'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', os.environ['ORCA_BASE_SHA'], 'HEAD'], text=True).splitlines()
          assert sorted(paths) == ['src/main/link-preview/link-preview-inert-markup.test.ts', 'src/main/network/page-metadata/html-markup-scanner.ts'], paths
          print('Verified exactly the scanner and existing public-reader regression test changed.')
          PYSCOPED
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Install repository toolchain and native dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
          native-runtime: node
          cache-pnpm-store: 'false'
          cache-pnpm-verification: 'false'
          persist-native-cache: 'false'
      - name: Check source formatting
        run: |
          if ! pnpm exec oxfmt --check src/main/link-preview/link-preview-inert-markup.test.ts src/main/network/page-metadata/html-markup-scanner.ts; then
            pnpm exec oxfmt --write src/main/link-preview/link-preview-inert-markup.test.ts src/main/network/page-metadata/html-markup-scanner.ts
            git diff -- src/main/link-preview/link-preview-inert-markup.test.ts src/main/network/page-metadata/html-markup-scanner.ts
            exit 1
          fi
      - name: Run required changed-file gate
        run: timeout 900 pnpm check:changed --base="$ORCA_BASE_SHA" --maxWorkers=2
      - name: Verify old scanner fails the real XHTML assertion
        run: |
          python3 - <<'PYCONTROL'
          from pathlib import Path
          import json
          import os
          import subprocess
          
          path = Path('src/main/network/page-metadata/html-markup-scanner.ts')
          test = 'src/main/link-preview/link-preview-inert-markup.test.ts'
          original = path.read_bytes()
          output = Path(os.environ['RUNNER_TEMP']) / 'html-old-scanner-control.json'
          try:
              path.write_bytes(subprocess.check_output(['git', 'show', f"{os.environ['ORCA_BASE_SHA']}:{path.as_posix()}"]))
              result = subprocess.run(['timeout', '900', 'pnpm', 'test', test, '--maxWorkers=2', '--reporter=json', f'--outputFile={output}'], timeout=950)
              data = json.loads(output.read_text())
              assert result.returncode == 1, result.returncode
              assert (data['numFailedTests'], data['numPassedTests'], data['numTotalTests']) == (1, 2, 3), data
              assertions = [a for suite in data['testResults'] for a in suite['assertionResults']]
              failed = [a for a in assertions if a['status'] == 'failed']
              assert len(failed) == 1
              assert any('AssertionError' in message for message in failed[0]['failureMessages'])
              summary = {'base': os.environ['ORCA_BASE_SHA'], 'exit_code': result.returncode, 'failed': 1, 'passed': 2, 'tests': [{'name': a['fullName'], 'status': a['status']} for a in assertions]}
              print(json.dumps(summary), flush=True)
              (Path(os.environ['RUNNER_TEMP']) / 'html-control-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          finally:
              path.write_bytes(original)
              assert path.read_bytes() == original
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          PYCONTROL
      - name: Compare exact public readers with seven paired samples
        run: |
          python3 - <<'PYBENCH'
          from pathlib import Path
          import os, subprocess
          root = Path(os.environ['RUNNER_TEMP']) / 'html-script-benchmark'
          root.mkdir(parents=True, exist_ok=True)
          paths = ['src/main/network/page-metadata/html-head-tags.ts', 'src/main/network/page-metadata/html-markup-scanner.ts', 'src/main/link-preview/link-preview-page-metadata.ts']
          for directory, ref in [('source', os.environ['ORCA_BASE_SHA']), ('candidate', os.environ['ORCA_CANDIDATE_SHA'])]:
              for path in paths:
                  target = root / directory / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(subprocess.check_output(['git', 'show', f'{ref}:{path}']))
          (root / 'benchmark.mjs').write_text("import './probe-loader.mjs'\nimport { performance } from 'node:perf_hooks'\nimport assert from 'node:assert/strict'\nimport { readFileSync, writeFileSync } from 'node:fs'\nimport { createHash } from 'node:crypto'\n\nconst current = await import('./source/src/main/link-preview/link-preview-page-metadata.ts')\nconst candidate = await import('./candidate/src/main/link-preview/link-preview-page-metadata.ts')\nconst pageUrl = new URL('https://example.test/page')\nconst expected = { title: 'Live', description: null, siteName: null, imageUrl: null, iconHref: '/favicon.ico' }\nlet sink = 0\nfunction batch(reader, html, iterations) {\n  const start = performance.now()\n  for (let index = 0; index < iterations; index++) {\n    const output = reader(html, pageUrl)\n    sink += output.title.length + output.iconHref.length\n  }\n  return performance.now() - start\n}\nconst median = (values) => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)]\nconst results = []\nfor (const count of [1000, 10000, 50000]) {\n  const html = '<script></script>'.repeat(count) + '<title>Live</title>'\n  assert.deepEqual(current.readLinkPreviewMetadata(html, pageUrl), expected)\n  assert.deepEqual(candidate.readLinkPreviewMetadata(html, pageUrl), expected)\n  for (let index = 0; index < 3; index++) {\n    batch(current.readLinkPreviewMetadata, html, 1)\n    batch(candidate.readLinkPreviewMetadata, html, 1)\n  }\n  const calibration = batch(current.readLinkPreviewMetadata, html, 1)\n  const iterations = Math.max(1, Math.min(64, Math.ceil(25 / calibration)))\n  const samples = []\n  for (let sample = 0; sample < 7; sample++) {\n    const order = sample % 2 ? ['candidate', 'current'] : ['current', 'candidate']\n    const elapsed = {}\n    for (const name of order) {\n      elapsed[name] = batch(name === 'current' ? current.readLinkPreviewMetadata : candidate.readLinkPreviewMetadata, html, iterations) / iterations\n    }\n    samples.push({ currentMs: elapsed.current, candidateMs: elapsed.candidate, ratio: elapsed.candidate / elapsed.current })\n  }\n  const result = { count, bytes: Buffer.byteLength(html), iterations, samples, currentMedianMs: median(samples.map(x => x.currentMs)), candidateMedianMs: median(samples.map(x => x.candidateMs)), medianPairedRatio: median(samples.map(x => x.ratio)) }\n  results.push(result)\n  console.log(JSON.stringify(result))\n}\nconst paths = ['src/main/network/page-metadata/html-head-tags.ts', 'src/main/network/page-metadata/html-markup-scanner.ts', 'src/main/link-preview/link-preview-page-metadata.ts']\nconst hashes = Object.fromEntries(['source', 'candidate'].map(dir => [dir, Object.fromEntries(paths.map(path => [path, createHash('sha256').update(readFileSync(new URL(`./${dir}/${path}`, import.meta.url))).digest('hex')]))]))\nconst report = { base: '2413e14de04eabbc884593ba37f207e44cb8c27c', node: process.version, platform: process.platform, protocol: 'Exact public readers, identical inputs and asserted full metadata; three warm-up pairs; equal batch counts calibrated on old reader to at least 25 ms (cap 64); seven alternating paired samples; median elapsed time per parse. No timing threshold.', hashes, results, sink }\nwriteFileSync(new URL('./benchmark-results.json', import.meta.url), JSON.stringify(report, null, 2) + '\\n')\n")
          (root / 'probe-loader.mjs').write_text("import { registerHooks } from 'node:module'\n\nregisterHooks({\n  resolve(specifier, context, nextResolve) {\n    try {\n      return nextResolve(specifier, context)\n    } catch (error) {\n      if (error.code === 'ERR_MODULE_NOT_FOUND' && specifier.startsWith('.')) {\n        return nextResolve(`${specifier}.ts`, context)\n      }\n      throw error\n    }\n  }\n})\n")
          PYBENCH
          timeout 900 node "$RUNNER_TEMP/html-script-benchmark/benchmark.mjs"
      - name: Record exact restored validation identity
        run: |
          git diff --exit-code
          git status --short
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-raw-text-review-evidence
          path: |
            ${{ runner.temp }}/html-control-summary.json
            ${{ runner.temp }}/html-old-scanner-control.json
            ${{ runner.temp }}/html-script-benchmark/benchmark-results.json
          if-no-files-found: ignore
