name: Validate CSV quoted-record follow-up
on:
  push:
    branches: [validation/orca-csv-records-20261127]
permissions:
  contents: read
jobs:
  changed-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_CANDIDATE_SHA: a2a60577a13ea8ee8696f8784a87564d7fab1ab5
      ORCA_CANDIDATE_TREE: 12f7084c1d1750d3290bbdfb50ed153be493193d
      ORCA_BASE_SHA: c3d47dca326baa9aa1f71defe5fb146589efc88c
      ORCA_REJECTED_SHA: 02e63a5a4325f2e9187db7c382d871f00e744f81
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Afloat16/orca
          ref: a2a60577a13ea8ee8696f8784a87564d7fab1ab5
          fetch-depth: 50
          persist-credentials: false
      - name: Verify exact candidate and two-file scope
        run: |
          test "$(git rev-parse HEAD)" = "$ORCA_CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$ORCA_CANDIDATE_TREE"
          python3 - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', os.environ['ORCA_BASE_SHA'], 'HEAD'], text=True).splitlines()
          assert sorted(paths) == ['src/renderer/src/components/editor/csv/document/csv-delimiter-detection.ts', 'src/renderer/src/components/editor/csv/document/csv-multiline-header-delimiter.test.ts'], paths
          print('Verified exactly the CSV detector and its parser regression.')
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Install repository toolchain and native dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
          native-runtime: node
          cache-pnpm-store: 'false'
          cache-pnpm-verification: 'false'
          persist-native-cache: 'false'
      - name: Check source formatting
        run: |
          if ! pnpm exec oxfmt --check src/renderer/src/components/editor/csv/document/csv-delimiter-detection.ts src/renderer/src/components/editor/csv/document/csv-multiline-header-delimiter.test.ts; then
            pnpm exec oxfmt --write src/renderer/src/components/editor/csv/document/csv-delimiter-detection.ts src/renderer/src/components/editor/csv/document/csv-multiline-header-delimiter.test.ts
            git diff -- src/renderer/src/components/editor/csv/document/csv-delimiter-detection.ts src/renderer/src/components/editor/csv/document/csv-multiline-header-delimiter.test.ts
            exit 1
          fi
      - name: Run required changed-file gate
        run: timeout 900 pnpm check:changed --base="$ORCA_BASE_SHA" --maxWorkers=2
      - name: Verify regressions fail on both main and the rejected fix
        run: |
          path=src/renderer/src/components/editor/csv/document/csv-delimiter-detection.ts
          test_path=src/renderer/src/components/editor/csv/document/csv-multiline-header-delimiter.test.ts
          trap 'git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"' EXIT
          git fetch --no-tags --depth=1 origin "$ORCA_REJECTED_SHA"
          for variant in main rejected; do
            if [ "$variant" = main ]; then
              control="$ORCA_BASE_SHA"
            else
              control="$ORCA_REJECTED_SHA"
            fi
            git show "$control:$path" > "$path"
            export CSV_CONTROL_REPORT="$RUNNER_TEMP/csv-$variant-control.json"
            set +e
            timeout 900 pnpm test "$test_path" --maxWorkers=2 --reporter=json --outputFile="$CSV_CONTROL_REPORT"
            result=$?
            set -e
            test "$result" -eq 1
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['CSV_CONTROL_REPORT']).read_text())
          assert result['numTotalTests'] == 2, result
          assert result['numFailedTests'] == 2, result
          assert result['numPassedTests'] == 0, result
          print('Both public detector regressions executed and failed under this control.')
          PY
          done
          git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"
          git diff --exit-code
      - name: Record validation identity
        run: |
          git diff --exit-code
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
