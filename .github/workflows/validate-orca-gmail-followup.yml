name: Validate Gmail mixed-body follow-up
on:
  push:
    branches: [validation/orca-gmail-followup-20261127]
permissions:
  contents: read
jobs:
  changed-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_CANDIDATE_SHA: 37eab7d59dd475152deb324760494383c9471968
      ORCA_CANDIDATE_TREE: ceae9cdb652375f7c926199d26650479e3be1afc
      ORCA_BASE_SHA: 251e9b0558be785f206aece6368a17b72e15c3b5
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Afloat16/orca
          ref: 37eab7d59dd475152deb324760494383c9471968
          fetch-depth: 50
          persist-credentials: false
      - name: Verify exact candidate and change scope
        run: |
          test "$(git rev-parse HEAD)" = "$ORCA_CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$ORCA_CANDIDATE_TREE"
          python3 - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', os.environ['ORCA_BASE_SHA'], 'HEAD'], text=True).splitlines()
          assert sorted(paths) == ['src/main/google/google-gmail-message.test.ts', 'src/main/google/google-gmail-message.ts'], paths
          print('Verified exactly two Gmail source/test files.')
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Install repository toolchain and native dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
          native-runtime: node
          cache-pnpm-store: 'false'
          cache-pnpm-verification: 'false'
          persist-native-cache: 'false'
      - name: Check source formatting
        run: |
          if ! pnpm exec oxfmt --check src/main/google/google-gmail-message.ts src/main/google/google-gmail-message.test.ts; then
            pnpm exec oxfmt --write src/main/google/google-gmail-message.ts src/main/google/google-gmail-message.test.ts
            git diff -- src/main/google/google-gmail-message.ts src/main/google/google-gmail-message.test.ts
            exit 1
          fi
      - name: Run required changed-file gate
        run: timeout 900 pnpm check:changed --base="$ORCA_BASE_SHA" --maxWorkers=2
      - name: Verify exact-priority parser regressions
        run: |
          timeout 900 pnpm test src/main/google/google-gmail-message.test.ts --maxWorkers=2 --reporter=json --outputFile="$RUNNER_TEMP/gmail-candidate.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'gmail-candidate.json').read_text())
          assert (result['numFailedTests'], result['numPassedTests'], result['numTotalTests']) == (0, 14, 14), result
          print('Exact candidate: 14 parser tests passed.')
          PY
      - name: Verify exact priority fails on preceding published parser
        run: |
          path=src/main/google/google-gmail-message.ts
          trap 'git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"' EXIT
          git show 0dcfb92508c7c499564f580a524d815a7eef66de:"$path" > "$path"
          set +e
          timeout 900 pnpm test src/main/google/google-gmail-message.test.ts --maxWorkers=2 --reporter=json --outputFile="$RUNNER_TEMP/gmail-exact-priority-control.json"
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'gmail-exact-priority-control.json').read_text())
          assert (result['numFailedTests'], result['numPassedTests'], result['numTotalTests']) == (1, 13, 14), result
          failures = [a for t in result['testResults'] for a in t['assertionResults'] if a['status'] == 'failed']
          assert len(failures) == 1 and 'pairs equivalent mixed plain and HTML siblings' in failures[0]['fullName'], failures
          assert any('AssertionError' in message for message in failures[0].get('failureMessages', [])), failures
          print('Preceding 0dcfb925 parser: exact-priority regression fails; 13 compatibility tests pass.')
          PY
          git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"
          git diff --exit-code
      - name: Record exact validation identity
        run: |
          test "$(git rev-parse HEAD)" = "$ORCA_CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$ORCA_CANDIDATE_TREE"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}'
