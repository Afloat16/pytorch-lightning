name: Validate Gmail mixed-body follow-up
on:
  push:
    branches: [validation/orca-gmail-followup-20261127]
permissions:
  contents: read
jobs:
  changed-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_CANDIDATE_SHA: db44ba1f58e78ecd7f40df0b16ba1fe1f1221f28
      ORCA_CANDIDATE_TREE: cfd9b1cacc10ef5485ba563d13bd2197d59d404c
      ORCA_BASE_SHA: 251e9b0558be785f206aece6368a17b72e15c3b5
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Afloat16/orca
          ref: db44ba1f58e78ecd7f40df0b16ba1fe1f1221f28
          fetch-depth: 50
          persist-credentials: false
      - name: Verify exact candidate and change scope
        run: |
          test "$(git rev-parse HEAD)" = "$ORCA_CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$ORCA_CANDIDATE_TREE"
          python3 - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', os.environ['ORCA_BASE_SHA'], 'HEAD'], text=True).splitlines()
          assert sorted(paths) == ['src/main/google/google-gmail-message.test.ts', 'src/main/google/google-gmail-message.ts'], paths
          print('Verified exactly two Gmail source/test files.')
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Install repository toolchain and native dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
          native-runtime: node
          cache-pnpm-store: 'false'
          cache-pnpm-verification: 'false'
          persist-native-cache: 'false'
      - name: Check source formatting
        run: |
          if ! pnpm exec oxfmt --check src/main/google/google-gmail-message.ts src/main/google/google-gmail-message.test.ts; then
            pnpm exec oxfmt --write src/main/google/google-gmail-message.ts src/main/google/google-gmail-message.test.ts
            git diff -- src/main/google/google-gmail-message.ts src/main/google/google-gmail-message.test.ts
            exit 1
          fi
      - name: Run required changed-file gate
        run: timeout 900 pnpm check:changed --base="$ORCA_BASE_SHA" --maxWorkers=2
      - name: Verify new regressions fail on upstream implementation
        run: |
          path=src/main/google/google-gmail-message.ts
          trap 'git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"' EXIT
          git show "$ORCA_BASE_SHA:$path" > "$path"
          set +e
          timeout 900 pnpm test src/main/google/google-gmail-message.test.ts --maxWorkers=2 --reporter=json --outputFile="$RUNNER_TEMP/gmail-main-control.json"
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'gmail-main-control.json').read_text())
          assert result['numFailedTests'] >= 5, result
          assert result['numTotalTests'] == 11, result
          print('Upstream negative control:', result['numFailedTests'], 'failed;', result['numPassedTests'], 'passed.')
          PY
          git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"
          git diff --exit-code
      - name: Verify review regressions fail on the published implementation
        run: |
          path=src/main/google/google-gmail-message.ts
          trap 'git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"' EXIT
          git show 154bf4f178550d324c3422d4d64937d300a523c0:"$path" > "$path"
          set +e
          timeout 900 pnpm test src/main/google/google-gmail-message.test.ts --maxWorkers=2 --reporter=json --outputFile="$RUNNER_TEMP/gmail-review-control.json"
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PYCONTROL'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'gmail-review-control.json').read_text())
          assert result['numFailedTests'] == 6, result
          assert result['numPassedTests'] == 5, result
          print('The six review regressions fail on the published implementation; the original five tests pass.')
          PYCONTROL
          git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"
          git diff --exit-code
      - name: Verify Content-ID literal compatibility control
        run: |
          path=src/main/google/google-gmail-message.ts
          trap 'git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"' EXIT
          git show d23649c4e307ca6250128f5c5d9931c42c89141c:"$path" > "$path"
          set +e
          timeout 900 pnpm test src/main/google/google-gmail-message.test.ts --maxWorkers=2 --reporter=json --outputFile="$RUNNER_TEMP/gmail-literal-control.json"
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PYCONTROL'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'gmail-literal-control.json').read_text())
          assert result['numFailedTests'] == 4, result
          assert result['numPassedTests'] == 7, result
          print('Content-ID literal and disposition regressions fail on the intermediate normalization; the other seven tests pass.')
          PYCONTROL
          git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"
          git diff --exit-code
      - name: Verify disposition comments fail on the preceding published parser
        run: |
          path=src/main/google/google-gmail-message.ts
          trap 'git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"' EXIT
          git show d73f16a051a073691adb6971328ebbf3401dcd86:"$path" > "$path"
          set +e
          timeout 900 pnpm test src/main/google/google-gmail-message.test.ts --maxWorkers=2 --reporter=json --outputFile="$RUNNER_TEMP/gmail-disposition-control.json"
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PYCONTROL'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'gmail-disposition-control.json').read_text())
          assert result['numFailedTests'] == 3, result
          assert result['numPassedTests'] == 8, result
          print('Disposition and two representation regressions fail on d73f16a; the preceding eight tests pass.')
          PYCONTROL
          git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"
          git diff --exit-code
      - name: Verify the related and template regressions on the preceding published parser
        run: |
          path=src/main/google/google-gmail-message.ts
          trap 'git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"' EXIT
          git show 915b9bd4cee7628675ea06c08654f22e9681b43a:"$path" > "$path"
          set +e
          timeout 900 pnpm test src/main/google/google-gmail-message.test.ts --maxWorkers=2 --reporter=json --outputFile="$RUNNER_TEMP/gmail-pairing-control.json"
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PYCONTROL'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'gmail-pairing-control.json').read_text())
          assert result['numFailedTests'] == 2, result
          assert result['numPassedTests'] == 9, result
          print('Related root and HTML template regressions fail on 915b9bd; the preceding nine tests pass.')
          PYCONTROL
          git restore --source="$ORCA_CANDIDATE_SHA" -- "$path"
          git diff --exit-code
      - name: Record validation identity
        run: |
          git status --short
          git diff --exit-code
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
