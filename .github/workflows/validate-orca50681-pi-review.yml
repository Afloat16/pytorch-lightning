name: Validate XML processing-instruction review follow-up
on:
  push:
    branches: [validation/orca50681-xml-pi-review-20261127]
permissions:
  contents: read
jobs:
  changed-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_CANDIDATE_SHA: 4412eff87ddef42c9d40372162830386f4b26268
      ORCA_CANDIDATE_TREE: 9ab7196a6327ae30655ad8c03cc2907c697d84cf
      ORCA_BASE_SHA: 1208a28a7a4a72f5582a434c9a46694f350416ed
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Afloat16/orca
          ref: 4412eff87ddef42c9d40372162830386f4b26268
          fetch-depth: 50
          persist-credentials: false
      - name: Verify exact candidate and two-file follow-up scope
        run: |
          test "$(git rev-parse HEAD)" = "$ORCA_CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$ORCA_CANDIDATE_TREE"
          python3 - <<'PYSCOPED'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', os.environ['ORCA_BASE_SHA'], 'HEAD'], text=True).splitlines()
          assert sorted(paths) == ['src/main/link-preview/link-preview-inert-markup.test.ts', 'src/main/network/page-metadata/html-markup-scanner.ts'], paths
          print('Verified exactly the scanner and existing public-reader regression test changed.')
          PYSCOPED
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Install repository toolchain and native dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
          native-runtime: node
          cache-pnpm-store: 'false'
          cache-pnpm-verification: 'false'
          persist-native-cache: 'false'
      - name: Check source formatting
        run: |
          if ! pnpm exec oxfmt --check src/main/link-preview/link-preview-inert-markup.test.ts src/main/network/page-metadata/html-markup-scanner.ts; then
            pnpm exec oxfmt --write src/main/link-preview/link-preview-inert-markup.test.ts src/main/network/page-metadata/html-markup-scanner.ts
            git diff -- src/main/link-preview/link-preview-inert-markup.test.ts src/main/network/page-metadata/html-markup-scanner.ts
            exit 1
          fi
      - name: Run required changed-file gate
        run: timeout 900 pnpm check:changed --base="$ORCA_BASE_SHA" --maxWorkers=2
      - name: Verify old scanner fails the real XHTML assertion
        run: |
          python3 - <<'PYCONTROL'
          from pathlib import Path
          import json
          import os
          import subprocess
          
          path = Path('src/main/network/page-metadata/html-markup-scanner.ts')
          test = 'src/main/link-preview/link-preview-inert-markup.test.ts'
          original = path.read_bytes()
          output = Path(os.environ['RUNNER_TEMP']) / 'html-old-scanner-control.json'
          try:
              path.write_bytes(subprocess.check_output(['git', 'show', f"{os.environ['ORCA_BASE_SHA']}:{path.as_posix()}"]))
              result = subprocess.run(['timeout', '900', 'pnpm', 'test', test, '--maxWorkers=2', '--reporter=json', f'--outputFile={output}'], timeout=950)
              data = json.loads(output.read_text())
              assert result.returncode == 1, result.returncode
              assert (data['numFailedTests'], data['numPassedTests'], data['numTotalTests']) == (1, 2, 3), data
              assertions = [a for suite in data['testResults'] for a in suite['assertionResults']]
              failed = [a for a in assertions if a['status'] == 'failed']
              assert len(failed) == 1
              assert any('AssertionError' in message for message in failed[0]['failureMessages'])
              summary = {'base': os.environ['ORCA_BASE_SHA'], 'exit_code': result.returncode, 'failed': 1, 'passed': 2, 'tests': [{'name': a['fullName'], 'status': a['status']} for a in assertions]}
              print(json.dumps(summary), flush=True)
              (Path(os.environ['RUNNER_TEMP']) / 'html-control-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          finally:
              path.write_bytes(original)
              assert path.read_bytes() == original
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          PYCONTROL
      - name: Record exact restored validation identity
        run: |
          git diff --exit-code
          git status --short
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-processing-instruction-review-evidence
          path: |
            ${{ runner.temp }}/html-control-summary.json
            ${{ runner.temp }}/html-old-scanner-control.json
          if-no-files-found: ignore
